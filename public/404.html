<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Landry</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2EC4C6">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/icone-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&family=Caveat:wght@600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /*
    IDÉE : la page s'est perdue en mer. Une bouteille dérive sur le lagon, le message à l'intérieur te ramène au rivage.
    COULEURS : lagon turquoise, papier blanc, rouge tifaifai, vert mape.
  */
  :root { --lagon: #2EC4C6; --profond: #1A9DA6; --mape: #0D4D3A; --rouge: #B3212E; --papier: #FFFDF8; --sable: #F3E2B8; --menu-fond: #FFFDF8; --menu-texte: #B3212E; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: linear-gradient(var(--lagon) 0 62%, var(--profond)); color: var(--mape); font: 400 17px/1.55 "Instrument Sans", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .d { font-family: "Anybody", "Arial Narrow", Impact, sans-serif; font-weight: 900; font-variation-settings: "wdth" 72; text-transform: uppercase; }
  .note { font-family: "Caveat", "Comic Sans MS", cursive; font-weight: 600; }

  main { position: relative; z-index: 2; height: 100%; display: grid; place-content: center; justify-items: center; text-align: center; padding: 24px; gap: 10px; }
  h1 { margin: 0; color: var(--rouge); font-size: clamp(7rem, 34vw, 16rem); line-height: .8; letter-spacing: -.02em; }
  h1 span { display: inline-block; animation: flotte 3.6s ease-in-out infinite; }
  h1 span:nth-child(2) { animation-delay: -1.2s; }
  h1 span:nth-child(3) { animation-delay: -2.4s; }
  @keyframes flotte { 50% { transform: translateY(-10px) rotate(-3deg); } }

  .message { background: var(--papier); padding: 18px 22px 16px; max-width: 30ch; rotate: -2deg; box-shadow: 0 14px 30px rgba(0, 60, 70, .3); border-radius: 3px; }
  .message p { margin: 0 0 12px; font-size: 1.55rem; line-height: 1.15; color: #14261F; }
  .boutons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .boutons a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--rouge); color: #fff; font: 600 1rem/1 "Instrument Sans", system-ui, sans-serif; text-decoration: none; }
  .boutons a + a { background: transparent; color: var(--rouge); box-shadow: inset 0 0 0 2px var(--rouge); }
  .boutons a:focus-visible { outline: 3px solid var(--mape); outline-offset: 3px; }

  /* La bouteille dérive d'un bord à l'autre */
  .bouteille { position: absolute; z-index: 1; bottom: 30%; left: -120px; width: 110px; animation: derive 26s linear infinite; }
  .bouteille svg { display: block; width: 100%; animation: tangue 3s ease-in-out infinite; }
  @keyframes derive { to { transform: translateX(calc(100vw + 240px)); } }
  @keyframes tangue { 50% { transform: rotate(-14deg) translateY(6px); } 0%, 100% { transform: rotate(-4deg); } }
  .vague { position: absolute; left: 0; right: 0; bottom: 26%; height: 30px; z-index: 1; opacity: .5;
    background: radial-gradient(circle at 20px -6px, transparent 20px, var(--papier) 21px 23px, transparent 24px) 0 0 / 40px 30px repeat-x;
    animation: houle 6s linear infinite; }
  .vague.b { bottom: 18%; opacity: .3; animation-duration: 9s; animation-direction: reverse; }
  @keyframes houle { to { background-position-x: 40px; } }
  @media (prefers-reduced-motion: reduce) { h1 span, .bouteille, .bouteille svg, .vague { animation: none; } .bouteille { left: 8%; } }
</style>
</head>
<body>
<div class="vague" aria-hidden="true"></div>
<div class="vague b" aria-hidden="true"></div>
<div class="bouteille" aria-hidden="true">
  <svg viewBox="0 0 120 50"><rect x="8" y="10" width="78" height="30" rx="13" fill="#BFEDE6" stroke="#0D4D3A" stroke-width="3"/><rect x="84" y="17" width="20" height="16" rx="4" fill="#BFEDE6" stroke="#0D4D3A" stroke-width="3"/><rect x="102" y="16" width="12" height="18" rx="3" fill="#B07A44"/><rect x="22" y="17" width="44" height="16" rx="2" fill="#FFFDF8" transform="rotate(-6 44 25)"/></svg>
</div>
<main>
  <h1 class="d" aria-label="404"><span>4</span><span>0</span><span>4</span></h1>
  <div class="message note">
    <p>Cette page s'est perdue dans le lagon… Le courant t'a amené ici, on te ramène au rivage ?</p>
    <div class="boutons">
      <a href="/">L'accueil</a>
      <a href="/bio">Mes liens</a>
      <a href="/galerie">La galerie</a>
    </div>
  </div>
</main>
<script src="/menu.js"></script>
<script src="/effets.js"></script>
</body>
</html>
